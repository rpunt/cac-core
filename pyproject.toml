[project]
name = "cac-core"
dynamic = ["version"]
description = ""
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<4.0"
authors = [
    {name = "Ryan Punt", email = "ryan@mirum.org"}
]
dependencies = [
    "logger>=1.4",
    "tabulate>=0.10.0",
    "requests>=2.34.2",
    "pyyaml>=6.0.3",
    "keyring>=25.7.0",
    "packaging>=26.3",
    "argcomplete>=3.7.2",
]
keywords = ["api", "framework", "cli", "command-lint", "python", "cli-tool"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent"
]

[project.urls]
homepage = "https://mirum.org/cac-core/"
repository = "https://github.com/rpunt/cac-core"

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
]
test = [
    "pytest>=9.2.0",
]
lint = [
    "ruff>=0.17.4",
    "black>=26.10.1",
    "isort>=9.0.2",
    "pylint>=4.1.3",
]
docs = [
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=3.1.0",
]
validation = [
    "jsonschema>=4.0.0",
]

[build-system]
requires = ["setuptools>=84.2.1", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]

[tool.setuptools.packages.find]
where = ["."]
include = ["cac_core*"]

[tool.setuptools.package-data]
# PEP 561: ship the marker so downstream projects' type checkers use cac-core's
# inline type hints instead of treating it as an untyped dependency.
"cac_core" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.isort]
profile = "black"
